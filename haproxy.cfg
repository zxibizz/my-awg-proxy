global
    log stdout format raw local0 info

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  5m
    timeout server  5m

# Container IPs change on recreate, so resolve service names at runtime rather
# than once at config parse.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

frontend socks_in
    bind *:1080
    default_backend vpn_pool

backend vpn_pool
    # Traffic goes to the socks port, but health is judged by the per-tunnel
    # probe: the socks daemon accepts connections happily over a dead tunnel,
    # and gluetun's own health server cannot see a tracker throttling us.
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check port 9998 inter 10s fall 2 rise 3 resolvers docker init-addr last,libc,none

    server vpn1 vpn1:1080
    server vpn2 vpn2:1080 backup
    server vpn3 vpn3:1080 backup
