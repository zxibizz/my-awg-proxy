services:
  core:
    build: ./core
    container_name: proxyarr-core
    cap_add:
      # NET_ADMIN configures the links; SYS_ADMIN is what lets the container
      # create its own network namespaces (docker's seccomp profile only
      # permits unshare/setns when it is present).
      - NET_ADMIN
      - SYS_ADMIN
    security_opt:
      # docker-default denies mount outright, which blocks `ip netns add` even
      # with SYS_ADMIN. Only bites on AppArmor hosts, so it is invisible on
      # Docker Desktop and fails on Ubuntu.
      - apparmor=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # Tunnel handshakes are forwarded from each netns out through eth0.
      - net.ipv4.ip_forward=1
    volumes:
      - ./data:/data
      # Imported once, only while ./data/peers is still empty.
      - ./wg_confs:/seed:ro
    environment:
      PROXYARR_TOKEN: ${PROXYARR_TOKEN:?set PROXYARR_TOKEN in .env}
      # tracker.php is the endpoint that gets throttled, but it answers 403 without
      # a session, so it only belongs here once PROBE_COOKIE is set.
      PROBE_URLS: https://google.com
      # all: one failing URL trips failover. any: every URL must fail.
      PROBE_MODE: all
      PROBE_INTERVAL: "60"
      PROBE_BAD_STATUS: "403,429,503"
      # Set once you have captured what a throttled response actually looks like.
      PROBE_BAD_TEXT: ""
      PROBE_COOKIE: ""
    ports:
      # Bound to loopback: the proxy has no auth.
      - "127.0.0.1:1080:1080"
    restart: unless-stopped

  web:
    build: ./web
    container_name: proxyarr-web
    environment:
      CORE_URL: http://core:8080
      PROXYARR_TOKEN: ${PROXYARR_TOKEN:?set PROXYARR_TOKEN in .env}
    ports:
      # Bound to loopback: the console has no auth.
      - "127.0.0.1:8088:8000"
    depends_on: [core]
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
