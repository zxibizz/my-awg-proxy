# One container per peer, each with its own socks5 port. A container is already
# a network namespace, so unlike the pooled stack this needs no SYS_ADMIN, no
# apparmor exception, no veth pairs and no NAT rules -- only NET_ADMIN and tun.
#
# Tunnels fail independently, so pointing different consumers at different ports
# keeps one bad exit from taking everything down.

x-socks: &socks
  build: ./socks
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped
  healthcheck:
    # Exercises the whole path: socks handshake, in-tunnel DNS, then egress.
    test: ["CMD", "curl", "-sf", "-m", "5", "-o", "/dev/null",
           "--socks5-hostname", "127.0.0.1:1080",
           "https://www.google.com/generate_204"]
    interval: 15s
    timeout: 10s
    retries: 3
    start_period: 20s

services:
  de:
    <<: *socks
    container_name: proxyarr-de
    volumes:
      - ./wg_confs/DE.conf:/config/wg.conf:ro
    ports:
      # No auth on the proxy: anything wider than loopback needs a source-IP
      # firewall rule (docker DNAT bypasses INPUT, so use the DOCKER-USER chain).
      - "1081:1080"

  nl:
    <<: *socks
    container_name: proxyarr-nl
    volumes:
      - ./wg_confs/NL.conf:/config/wg.conf:ro
    ports:
      - "1082:1080"

  se:
    <<: *socks
    container_name: proxyarr-se
    volumes:
      - ./wg_confs/SE.conf:/config/wg.conf:ro
    ports:
      - "1083:1080"
